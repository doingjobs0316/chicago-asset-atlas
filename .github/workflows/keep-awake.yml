# Keeps the Supabase database awake: free projects pause after about a week with no requests.
# Once a day it reads one place from the public map list (the same read every visitor's browser makes).
# If the read fails, the run fails and GitHub emails the repo owner: the project may be paused (restore it in Supabase).
#
# GitHub also turns off daily jobs in repos with no commits for 60 days, so when the last commit is
# more than 50 days old this job commits a date to .github/keep-awake.txt to keep itself running.
name: Keep the database awake

on:
  schedule:
    - cron: '17 14 * * *' # every day, 14:17 UTC (8:17 or 9:17 in Chicago)
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one place from the map list
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
            'https://hefwyurtblwptugfhrgq.supabase.co/rest/v1/map_listings?select=ID&limit=1' \
            -H 'apikey: sb_publishable_Pjlw43qEgb2gVNPE5H7rzA_r_XvYRP-')
          echo "Supabase answered $code"
          test "$code" = 200

      - uses: actions/checkout@v4
      - name: Keep this daily job switched on
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            date -u +%F > .github/keep-awake.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/keep-awake.txt
            git commit -m 'Keep the daily database check switched on'
            git push
          else
            echo 'Recent commits; nothing to do.'
          fi
